<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Табак магазин</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .container { max-width: 500px; margin: 0 auto; padding: 10px; }
        .header { background: #1f1f1f; color: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .product { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product h3 { margin-bottom: 5px; color: #333; }
        .price { font-size: 18px; font-weight: bold; color: #27ae60; margin: 10px 0; }
        button { background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #229954; }
        .cart { margin-top: 20px; padding: 15px; background: white; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚬 Табак Магазин</h1>
            <p>Доставка в ваш город</p>
        </div>

        <div id="products"></div>

        <div class="cart">
            <h3>🛒 Корзина (<span id="cartCount">0</span>)</h3>
            <div id="cartItems"></div>
            <button onclick="checkout()" style="margin-top: 10px;">Оформить заказ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const products = [
            { id: 1, name: 'Табак Davidoff', price: 450, desc: 'Премиум сорт' },
            { id: 2, name: 'Табак Dunhill', price: 380, desc: 'Классический вкус' },
            { id: 3, name: 'Табак Parliament', price: 350, desc: 'Лёгкий и свежий' },
            { id: 4, name: 'Табак Marlboro', price: 300, desc: 'Крепкий вкус' },
        ];

        let cart = [];

        function displayProducts() {
            const container = document.getElementById('products');
            container.innerHTML = products.map(p => `
                <div class="product">
                    <h3>${p.name}</h3>
                    <p>${p.desc}</p>
                    <div class="price">${p.price} ₽</div>
                    <button onclick="addToCart(${p.id}, '${p.name}', ${p.price})">Добавить в корзину</button>
                </div>
            `).join('');
        }

        function addToCart(id, name, price) {
            cart.push({ id, name, price });
            updateCart();
            tg.HapticFeedback.impactOccurred('light');
        }

        function updateCart() {
            document.getElementById('cartCount').textContent = cart.length;
            const cartHTML = cart.map((item, i) => `
                <div>${item.name} - ${item.price}₽ 
                <button style="width: auto; padding: 5px 10px; font-size: 12px;" onclick="removeFromCart(${i})">✕</button></div>
            `).join('');
            document.getElementById('cartItems').innerHTML = cartHTML || 'Корзина пуста';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function checkout() {
            if (cart.length === 0) {
                tg.showAlert('Корзина пуста!');
                return;
            }

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            const message = `Заказ:\n${cart.map(i => `${i.name}: ${i.price}₽`).join('\n')}\n\nИтого: ${total}₽`;

            tg.sendData(JSON.stringify({ cart, total }));

            tg.showAlert('Заказ отправлен! Проверьте личные сообщения');
        }

        displayProducts();
    </script>
</body>
</html>
